name: Release Build

on:
  push:
    branches: [main]
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: true

jobs:
  # ----- Web build + deploy to GitHub Pages (every push, incl. tags) -----
  web-deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      RAZORPAY_KEY_ID: ${{ secrets.RAZORPAY_KEY_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.4
          cache: true

      - name: Create .env from secrets
        run: |
          echo "SUPABASE_URL=$SUPABASE_URL" >> .env
          echo "SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY" >> .env
          echo "RAZORPAY_KEY_ID=$RAZORPAY_KEY_ID" >> .env

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test

      - name: Static analysis
        run: dart analyze lib/

      - name: Build Web
        run: flutter build web --release --base-href=/Energy-Management-System/
        if: success()

      - name: Configure Security Headers
        run: |
          python3 - <<'PYEOF'
          import re
          path = "build/web/index.html"
          with open(path, encoding="utf-8") as f:
              html = f.read()

          metas = "\n".join([
            '<meta http-equiv="Content-Security-Policy" content="default-src \'self\'; script-src \'self\' \'wasm-unsafe-eval\' https://www.gstatic.com; style-src \'self\' \'unsafe-inline\' https://fonts.googleapis.com; img-src \'self\' data: https:; font-src \'self\' https://fonts.gstatic.com; connect-src \'self\' https://*.supabase.co https://fonts.googleapis.com https://fonts.gstatic.com; worker-src \'self\' blob:; frame-ancestors \'none\'; base-uri \'self\'; form-action \'self\'">',
            '<meta http-equiv="X-Content-Type-Options" content="nosniff">',
            '<meta http-equiv="X-Frame-Options" content="DENY">',
            '<meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin">',
            '<meta http-equiv="Permissions-Policy" content="geolocation=(); microphone=(); camera=(); payment=(); usb=();">',
          ])

          if "<head>" in html:
              html = html.replace("<head>", "<head>\n" + metas, 1)
          elif "<html" in html:
              html = re.sub(r"(<html[^>]*>)", r"\1\n<head>\n" + metas + "\n</head>", html, count=1)
          else:
              raise SystemExit("ERROR: no <head> or <html> found in index.html")

          with open(path, "w", encoding="utf-8") as f:
              f.write(html)
          print("Security meta tags injected into <head>")
          PYEOF
        if: success()

      - name: Upload Web Artifact
        uses: actions/upload-pages-artifact@v3
        if: success()
        with:
          path: build/web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        if: success()

      - name: Security Headers Verification
        run: |
          if [ -f build/web/index.html ]; then
            if grep -q "Content-Security-Policy" build/web/index.html && \
               grep -q "X-Content-Type-Options" build/web/index.html && \
               grep -q "X-Frame-Options" build/web/index.html; then
              echo "Security headers are properly configured"
            else
              echo "Security headers are missing - CHECK REQUIRED"
              exit 1
            fi
            if grep -q "flutter_bootstrap.js" build/web/index.html; then
              echo "Flutter bootstrap preserved"
            else
              echo "Flutter bootstrap MISSING - index.html was corrupted"
              exit 1
            fi
          else
            echo "Web build artifact not found"
            exit 1
          fi
        if: success()

  # ----- Android APK (only on version tags) -----
  android-apk:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      RAZORPAY_KEY_ID: ${{ secrets.RAZORPAY_KEY_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.4
          cache: true

      - name: Create .env from secrets
        run: |
          echo "SUPABASE_URL=$SUPABASE_URL" >> .env
          echo "SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY" >> .env
          echo "RAZORPAY_KEY_ID=$RAZORPAY_KEY_ID" >> .env

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK (release)
        run: flutter build apk --release

      - name: Upload APK to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: build/app/outputs/flutter-apk/app-release.apk
          fail_on_unmatched_files: false

  # ----- Windows desktop bundler (only on version tags) -----
  windows-desktop:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      RAZORPAY_KEY_ID: ${{ secrets.RAZORPAY_KEY_ID }}
      # GitHub windows runners force this ON by default: any native command
      # writing to stderr (Nuget/CMake warnings) kills the pwsh step. Flutter
      # tooling is noisy on windows — keep stderr as success-stream output.
      PSNativeCommandUseErrorActionPreference: 'false'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.4
          cache: true

      - name: Create .env from secrets
        shell: pwsh
        run: |
          "SUPABASE_URL=$env:SUPABASE_URL" | Out-File -FilePath .env -Encoding utf8
          "SUPABASE_ANON_KEY=$env:SUPABASE_ANON_KEY" | Out-File -FilePath .env -Append -Encoding utf8
          "RAZORPAY_KEY_ID=$env:RAZORPAY_KEY_ID" | Out-File -FilePath .env -Append -Encoding utf8

      - name: Install dependencies
        shell: cmd
        run: flutter pub get

      - name: Build Windows (release)
        shell: cmd
        run: flutter build windows --release

      - name: Package Windows bundle
        shell: pwsh
        run: |
          $releaseDir = "build/windows/x64/runner/Release"
          if (-not (Test-Path $releaseDir)) { Write-Error "Windows release dir missing"; exit 1 }
          $zip = "Energy-Management-System-Windows-${{ github.ref_name }}.zip"
          Compress-Archive -Path "$releaseDir/*" -DestinationPath $zip -Force
          Write-Output "Zipped -> $zip"

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress

      - name: Build Setup.exe installer
        shell: pwsh
        run: |
          $iscc = Get-ChildItem "C:\Program Files*\Inno Setup*\ISCC.exe" `
            | Select-Object -First 1 -ExpandProperty FullName
          if (-not $iscc) { Write-Error "ISCC.exe not found"; exit 1 }
          & $iscc "windows/installer.iss" "/DAppVersion=${{ github.ref_name }}"
          if ($LASTEXITCODE -ne 0) { Write-Error "Inno Setup failed"; exit $LASTEXITCODE }
          Get-ChildItem "build/installer"

      - name: Upload installer + bundle to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            build/installer/EMS*Setup*.exe
            Energy-Management-System-Windows-${{ github.ref_name }}.zip
          fail_on_unmatched_files: false