name: Release Build

on:
  push:
    branches: [main, feature/tod-slot-engine-v125]
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  actions: read

concurrency:
  group: release
  cancel-in-progress: true

jobs:
  # ----- Web build + deploy to GitHub Pages (every push, incl. tags) -----
  web-deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      RAZORPAY_KEY_ID: ${{ secrets.RAZORPAY_KEY_ID }}
    steps:
      - uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.4
          cache: true

      - name: Create .env from secrets
        run: |
          echo "SUPABASE_URL=$SUPABASE_URL" >> .env
          echo "SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY" >> .env
          echo "RAZORPAY_KEY_ID=$RAZORPAY_KEY_ID" >> .env
          # GitHub Pages drops dotfiles — bundle a no-dot copy for the web.
          mkdir -p assets
          cp .env assets/env

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test

      - name: Static analysis
        run: dart analyze lib/

      - name: Build Web
        run: flutter build web --release --base-href=/Energy-Management-System/
        if: success()

      - name: Configure Security Headers
        run: |
          python3 - <<'PYEOF'
          import re
          path = "build/web/index.html"
          with open(path, encoding="utf-8") as f:
              html = f.read()

          metas = "\n".join([
            '<meta http-equiv="Content-Security-Policy" content="default-src \'self\'; script-src \'self\' \'wasm-unsafe-eval\' https://www.gstatic.com; style-src \'self\' \'unsafe-inline\' https://fonts.googleapis.com; img-src \'self\' data: https:; font-src \'self\' https://fonts.gstatic.com; connect-src \'self\' https://*.supabase.co https://fonts.googleapis.com https://fonts.gstatic.com; worker-src \'self\' blob:; frame-ancestors \'none\'; base-uri \'self\'; form-action \'self\'">',
            '<meta http-equiv="X-Content-Type-Options" content="nosniff">',
            '<meta http-equiv="X-Frame-Options" content="DENY">',
            '<meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin">',
            '<meta http-equiv="Permissions-Policy" content="geolocation=(); microphone=(); camera=(); payment=(); usb=();">',
          ])

          if "<head>" in html:
              html = html.replace("<head>", "<head>\n" + metas, 1)
          elif "<html" in html:
              html = re.sub(r"(<html[^>]*>)", r"\1\n<head>\n" + metas + "\n</head>", html, count=1)
          else:
              raise SystemExit("ERROR: no <head> or <html> found in index.html")

          with open(path, "w", encoding="utf-8") as f:
              f.write(html)
          print("Security meta tags injected into <head>")
          PYEOF
        if: success()

      - name: Upload Web Artifact
        uses: actions/upload-pages-artifact@v4
        if: success()
        with:
          path: build/web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: wandalen/wretry.action@v3
        if: success()
        with:
          action: actions/deploy-pages@v5
          attempt_limit: 4
          attempt_delay: 30000

      - name: Security Headers Verification
        run: |
          if [ -f build/web/index.html ]; then
            if grep -q "Content-Security-Policy" build/web/index.html && \
               grep -q "X-Content-Type-Options" build/web/index.html && \
               grep -q "X-Frame-Options" build/web/index.html; then
              echo "Security headers are properly configured"
            else
              echo "Security headers are missing - CHECK REQUIRED"
              exit 1
            fi
            if grep -q "flutter_bootstrap.js" build/web/index.html; then
              echo "Flutter bootstrap preserved"
            else
              echo "Flutter bootstrap MISSING - index.html was corrupted"
              exit 1
            fi
          else
            echo "Web build artifact not found"
            exit 1
          fi
        if: success()
