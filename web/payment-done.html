<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Payment complete — PowerEMS</title>
<style>
  body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
         background: #0e1420; color: #e8edf5; display: flex; align-items: center;
         justify-content: center; min-height: 100vh; margin: 0; text-align: center; }
  .card { background: #1a2332; padding: 40px 32px; border-radius: 16px; max-width: 420px; }
  .check { font-size: 56px; color: #4ade80; }
  h1 { font-size: 22px; margin: 12px 0 8px; }
  p { color: #aab4c5; font-size: 15px; line-height: 1.5; margin: 0; }
</style>
</head>
<body>
  <div class="card">
    <div class="check">&#10004;</div>
    <h1>Payment complete!</h1>
    <p>Your PowerEMS plan has been updated and this window will close
       automatically. If it does not, you can close it and check the app.</p>
  </div>
  <script>
    setTimeout(function () {
      try { window.close(); } catch (e) { /* fall back to manual close */ }
    }, 1200);
  </script>
</body>
</html>
